name: CI

# PRs into main run the full gate. `push` to main runs the same checks
# after merge as a smoke layer. `workflow_dispatch` keeps manual runs
# available for spot checks (matches the previous manual-only convention).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # `src/integrations/keyx.rs` calls `env!("AUTH_URL", "...")` which fails
  # the compile if the variable isn't set. CI doesn't need a real auth
  # backend — it just needs *some* value so the build succeeds — so we
  # bake in a localhost stub URL. Production builds set this to the real
  # auth host on the build command. See `docs/COMPANY_ENV.md`.
  AUTH_URL: http://127.0.0.1:9100

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets --no-fail-fast

  audit:
    name: cargo audit (RustSec)
    runs-on: ubuntu-latest
    # Don't block merges on advisories — they can land between PRs. Notify
    # via the check status, but a vuln in a transitive dep shouldn't gate
    # an unrelated bugfix. Flip to `false` once the dep tree is clean.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --workspace --all-features

  # macOS cross-platform check. Several modules are
  # `#[cfg(target_os = "linux")]` (io_uring acceptor, kTLS listener,
  # eBPF userspace stubs) — the Ubuntu jobs above only exercise the
  # Linux side. Running `cargo check` on macOS catches the inverse
  # regression: a code change that breaks the non-Linux build because
  # someone forgot to `cfg`-gate an import or struct field. We don't
  # run tests or clippy here (those run on Ubuntu); just a build to
  # keep the macOS path honest.
  check-macos:
    name: cargo check (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
