[workspace]
members = [".", "bench"]

[package]
name = "lynxx-gateway"
version = "0.9.0"
edition = "2021"
# Proprietary — see LICENSE. Not published to crates.io.
license = "Proprietary"
# Pin MSRV so the resolver picks AWS SDK transitive crates that compile
# on the host toolchain. Without this, cargo selects the newest aws-smithy-*
# crates which require rustc 1.91+.
rust-version = "1.90"

# Lint policy. `cargo clippy -- -D warnings` in CI takes these into account.
# Each `allow` here is a deliberate choice — see comment for rationale.
# Correctness / safety lints stay strict; ergonomic + style lints are
# allowed with documented justifications so reviewers see *why* each rule
# is suppressed rather than guessing.
[lints.clippy]

# ── Wide signatures: 8-13 args common in spawned-task handlers ──
# Refactoring to builder structs would break stable plugin API. Deferred.
too_many_arguments = "allow"

# ── Complex closure types: Arc<dyn Fn(...) -> BoxFuture> across plugins ──
# Type aliases pending plugin-author coordination.
type_complexity = "allow"

# ── Large Err variant: GatewayError carries an inline SyncBody ──
# Boxing would force a heap allocation on every plugin short-circuit
# (rate-limit, cache hit) — that's the hot path.
result_large_err = "allow"

# ── len() without is_empty(): naming convention, not a bug ──
# The relevant types (e.g. AdminAuthCache) expose len() as part of an
# observability surface, not a collection-shape API. is_empty is irrelevant.
len_without_is_empty = "allow"

# ── from_str collision with std::str::FromStr ──
# Several enums expose `from_str` as fallible string-parse helpers that
# predate Rust's FromStr trait. Renaming would break every caller; the
# trait will be impl'd separately when we get to it.
should_implement_trait = "allow"

# ── Collapsible if/match/let: style preference, deferred ──
# Some are intentionally non-collapsed for readability when the inner
# branch has surrounding comments.
collapsible_if = "allow"
collapsible_match = "allow"
match_like_matches_macro = "allow"

# ── format! in format! args: tracing/log calls often nest formats ──
format_in_format_args = "allow"

# ── &mut Vec vs &mut [_]: would change public function signatures ──
ptr_arg = "allow"

# ── Stylistic refactors deferred ──
# These are real improvements but each requires touching a stable surface.
needless_range_loop = "allow"  # `for i in 0..w.len()` → `for (i, x) in w.iter().enumerate()`
map_identity = "allow"          # `.map(|x| x)` → just remove
unnecessary_sort_by = "allow"   # `.sort_by(|a,b| a.k.cmp(&b.k))` → `.sort_by_key(|x| x.k)`
if_same_then_else = "allow"     # one site intentionally identical (deploy-aware retry branches)
manual_clamp = "allow"          # one place uses `.max(lo).min(hi)`
manual_is_multiple_of = "allow" # bench module — keep arithmetic explicit
doc_lazy_continuation = "allow" # markdown list indentation in rustdoc

[lints.rust]
# Set explicitly so `cargo clippy -- -D warnings` and editor checks agree.
unused_imports = "warn"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["macros", "ws"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "webpki-tokio", "native-tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
num_cpus = "1"
# Pin each tokio worker thread to a specific core for better L1/L2
# cache locality. No-op on platforms without the affinity API.
core_affinity = "0.8"
# `rc` feature enables Deserialize/Serialize for Arc<T> and Rc<T>, which we
# rely on to use `Arc<str>` for model fields that are heavily cloned on the
# proxy hot path (Service.name, Target.url). Without `rc` we'd need a
# newtype + ~80 lines of trait/serde boilerplate. The feature itself is a
# small impl module — no extra compile time of note.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
opentelemetry = { version = "0.27", features = ["trace"] }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["http-proto", "reqwest-client"] }
tracing-opentelemetry = "0.28"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "5"
# ahash is 2-5× faster than the default SipHash that std + dashmap
# pick to be DoS-resistant. For INTERNAL-only maps (route table,
# admin-token cache, etc.) where the keys are server-generated UUIDs
# or fingerprint hashes — i.e. not attacker-influenced — that
# trade-off is wrong; we want the speed. Used only behind structs
# that are not deserialised from caller input.
ahash = "0.8"
jsonwebtoken = "9"
toml = "0.8"
thiserror = "1"
anyhow = "1"
async-trait = "0.1"
http-body-util = "0.1"
sqlx = { version = "0.8", features = ["runtime-tokio", "any", "sqlite", "postgres", "macros", "chrono", "uuid", "json", "tls-rustls"] }
metrics = "0.23"
metrics-exporter-prometheus = "0.15"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
url = "2"
ipnet = "2"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
jsonschema = "0.18"
kube = { version = "0.95", default-features = false, features = ["runtime", "derive", "client", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
k8s-openapi = { version = "0.23", features = ["latest"] }
schemars = "0.8"
clap = { version = "4", features = ["derive", "env"] }
serde_yaml = "0.9"
dirs = "5"
# TLS termination on the proxy listener (rustls-only; no OpenSSL dep).
axum-server = { version = "0.7", features = ["tls-rustls"] }
# Caching DNS resolver for the upstream connector — shaves the long tail by
# eliminating gai lookups on cold connections.
hickory-resolver = { version = "0.24", features = ["tokio-runtime"] }
# Cert/key parsing for per-service outbound mTLS and inbound mTLS validation.
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
webpki-roots = "0.26"
x509-parser = "0.16"
tower-service = "0.3"
# Distributed rate limiting (redis-rate-limit plugin).
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# LLM gateway plugin: tokenizer for OpenAI-family models. Other providers
# (Anthropic, local) fall back to a `len/4` heuristic — see plugins/llm_gateway.
tiktoken-rs = "0.6"
regex = "1"

# Response compression plugin: gzip, brotli, and Zstandard (all pure-Rust).
flate2 = "1"
zstd = "0.13"
brotli = "7"

# graphql-guard plugin: parse GraphQL queries for depth, complexity, alias
# count, persisted-query lookup, per-field rate limits. Pure-sync parser, no
# async runtime. Document AST only — we never execute queries here.
graphql-parser = "0.4"

# WebAssembly plugin runtime. Wraps cranelift + a small interpreter for
# untrusted module execution. Default features include cranelift, parallel
# compilation, and the cache; we don't enable wasi to keep the host
# surface limited to the explicit `lynxx_*` ABI in src/plugins/wasm/host.rs.
wasmtime = "27"

# OpenAPI 3.0 parsing for the `lynxx import` CLI flow and the
# `openapi-drift` / `openapi-mock` plugins. We deliberately picked
# `openapiv3` over `oas3`: the latter blew up on several real-world
# 3.0 specs we tested (notably anything with deeply-nested `allOf`
# in a request body). 3.1 specs work on a best-effort basis; the
# pieces that matter for routing — paths, methods, parameters,
# requestBody schemas, and response examples — are compatible.
openapiv3 = "2"

# License gating — uses the existing reqwest client to verify an API
# key against the licence server on startup, with a local 7-day cache
# for offline restarts. See src/license/mod.rs.

# Password hashing for gateway admin tokens.
argon2 = "0.5"
hex = "0.4"
# Ed25519 signature verification for signed /v1/license/verify responses.
# The billing server signs responses with a private key; the gateway
# verifies with the embedded public key to prevent MITM tampering.
ed25519-dalek = "2"

# Self-signed certificate generation for the ACME/cert-manager module.
# Used when `[gateway.acme].self_signed = true` to create a dev/test cert
# on startup when no real cert exists on disk. Also generates the CSR for
# future full-ACME flows and TLS-ALPN-01 challenge certs.
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }

# Time library — used by the PKI module to set certificate validity
# periods. Must match the version used by rcgen (0.3.x).
time = "0.3"

# Async pure-Rust ACME client. Used by the built-in ACME module to
# register accounts, create orders, and finalize certificates with
# Let's Encrypt (or any RFC 8555 CA). Handles nonces, JWS signing,
# and the order state machine so we only implement challenge logic.
instant-acme = "0.7"

# Docker Engine API client. Powers the optional Docker provider: when
# `[gateway.providers.docker].enabled = true` the gateway watches the
# Docker socket for container start/stop events and registers services
# + routes from container labels — same shape as Traefik's Docker
# provider. Default features pull in unix-socket + http transport;
# anything beyond that (TLS, swarm, etc.) is opt-in per call site.
bollard = "0.17"
quinn = "0.11.9"
h3 = "0.0.8"
h3-quinn = "0.0.10"
rustls-pki-types = "1.14.1"
bytes = "1.11.1"
http = "1.4.0"
libc = "0.2"
socket2 = "0.5"
rust-embed = { version = "8.11.0", features = ["axum"] }
mime_guess = "2.0.5"
subtle = "2.6.1"

[lib]
name = "lynxx_gateway"
path = "src/lib.rs"

[[bin]]
name = "lynxx-gateway"
path = "src/main.rs"

[[bin]]
name = "lynxx-ingress"
path = "src/ingress/main.rs"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
wat = "1"
# cache-bust: 1778248579

# Faster allocator — disabled on Windows where the C source doesn't
# cross-compile cleanly via zig.
[target.'cfg(not(target_os = "windows"))'.dependencies]
mimalloc = { version = "0.1", default-features = false }

# Kernel TLS offload — Linux-only. Added by PR #8.
#
# `ktls` extracts the negotiated cipher state from a completed
# `tokio-rustls` handshake and calls `setsockopt(TLS_TX/TLS_RX)` to
# hand the bulk encrypt/decrypt path to the kernel. After conversion
# the socket reads/writes plaintext from userspace's point of view —
# every record memcpy + crypto round-trip disappears from the gateway
# hot path, and `sendfile(2)` becomes legal on TLS connections.
#
# Pulled in only on Linux because the crate calls into `linux/tls.h`
# socket options that don't exist on macOS/Windows. Opt-in at runtime
# via `[gateway.tls].kernel_tls = true`; see `src/proxy/ktls_listener.rs`.
#
# `default-features = false` because the crate's defaults pull in
# `aws-lc-rs`, which conflicts with our `ring` provider choice. We
# enable `ring` + `tls12` explicitly to match the rest of the TLS
# stack (rustls 0.23 + tokio-rustls 0.26, both on ring).
#
# io_uring — Linux-only, low-level userspace interface. Added by this PR.
#
# Used by the proxy listener's optional multishot-accept thread (see
# `src/utilities/io_uring_accept.rs`). The full tokio→tokio-uring
# migration is a multi-week effort and explicitly NOT what this dep
# enables; here we use the low-level `io-uring` crate from a single
# dedicated `std::thread` to issue `IORING_OP_ACCEPT` SQEs and forward
# the accepted FDs to the tokio runtime over an `mpsc` channel.
#
# Read `docs/IO_URING.md` before integrating elsewhere — most of the
# big io_uring wins (registered buffers, zero-copy splice, SQPOLL)
# would require running the data plane on a different runtime, which
# is not what this dep is for.
[target.'cfg(target_os = "linux")'.dependencies]
ktls = { version = "6", default-features = false, features = ["ring", "tls12"] }
io-uring = "0.7"

# Release-profile tuning for the proxy hot path.
#
# Defaults leave 10–20% perf on the table:
#   * `codegen-units = 16` blocks cross-unit inlining (Hyper / Tokio /
#     our handler chain are separate units → no inlining across them)
#   * no LTO means the optimizer can't see across crate boundaries
#   * `panic = "unwind"` keeps landing pads + cleanup glue around every
#     `?` operator on the hot path
#
# Combined gain target in the gateway-vs-HAProxy bench: ~8–15% RPS at
# the saturation point with no other code changes. Compile time goes
# from ~3 min to ~10–15 min; only impacts CI / release builds.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
overflow-checks = false
