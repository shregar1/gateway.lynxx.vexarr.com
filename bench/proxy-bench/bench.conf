# bench.conf — central config for the proxy-bench rig.
#
# Sourced (bash) by orchestrate-sweep.sh, every proxies/<name>.sh, and
# lib/common.sh. Values can be overridden per-invocation via environment
# variables (`RPS_LEVELS="..." ./proxies/kong.sh`). The `:-` default
# operator in each line means "use the env var if already set, otherwise
# use this value."
#
# Anything proxy-specific (e.g. KONG_IMAGE) lives at the bottom so this
# file stays the single source of truth and per-proxy scripts don't
# hard-code values that someone might want to bump.

# ─── RPS ladder + explode thresholds ─────────────────────────────────────
# Sweep is open-loop: lynxx-bench schedules at the target rate. If the
# SUT can't keep up, the run stretches past DURATION_SECS until all
# scheduled requests complete — so the actual achieved RPS is what
# matters (printed in each result file as `achieved_rps:`).
#
# A level is considered EXPLODED (ladder stops) if either:
#   - p99 latency > P99_EXPLODE_MS, OR
#   - error rate > ERR_EXPLODE_RATE
RPS_LEVELS="${RPS_LEVELS:-10000 25000 50000 100000 200000 400000 600000 800000 1000000}"
DURATION_SECS="${DURATION_SECS:-60}"
WARMUP_SECS="${WARMUP_SECS:-10}"
CONNECTIONS="${CONNECTIONS:-1024}"
P99_EXPLODE_MS="${P99_EXPLODE_MS:-100}"
ERR_EXPLODE_RATE="${ERR_EXPLODE_RATE:-0.01}"

# ─── Orchestrator ────────────────────────────────────────────────────────
# Space-separated proxies the orchestrator runs by default. Each must
# correspond to an executable file at proxies/<name>.sh.
PROXIES_DEFAULT="${PROXIES_DEFAULT:-direct lynxx nginx haproxy envoy traefik kong caddy}"

# Seconds the orchestrator sleeps between proxies. Gives the kernel
# time to drain TIME_WAIT sockets + SYN cookie state from the prior
# blast. Without this, run order biases the results.
COOLDOWN_SECS="${COOLDOWN_SECS:-15}"

# ─── Ports ───────────────────────────────────────────────────────────────
UPSTREAM_PORT="${UPSTREAM_PORT:-19090}"   # lynxx-mock-upstream
PROXY_PORT="${PROXY_PORT:-28080}"         # SUT proxy listens here
AUTH_PORT="${AUTH_PORT:-9100}"            # local auth stub (or real keyx)
LYNXX_ADMIN_PORT="${LYNXX_ADMIN_PORT:-28081}"

# ─── Paths ───────────────────────────────────────────────────────────────
BENCH_DIR="${BENCH_DIR:-$HOME/bench}"
SRC_DIR="${SRC_DIR:-$HOME/lynxx-src}"
RESULTS_DIR="${RESULTS_DIR:-$BENCH_DIR/results}"      # raw lynxx-bench .txt output, one per level
CONFIGS_DIR="${CONFIGS_DIR:-$BENCH_DIR/configs}"
# Structured per-sweep JSON output. Each full sweep of a proxy writes
# one file at $BENCH_OUTPUTS_DIR/<proxy>/NN.json with NN auto-
# incrementing from 01. Rsync this dir back to bench/proxy-bench/outputs/
# in the repo to commit results.
BENCH_OUTPUTS_DIR="${BENCH_OUTPUTS_DIR:-$BENCH_DIR/outputs}"

# ─── Auth ────────────────────────────────────────────────────────────────
# AUTH_URL points the lynxx-gateway at the key-validation service. The
# default is the local Python stub that lib/common.sh starts as part of
# ensure_infra. Override to hit a real keyx instance for end-to-end
# realism (will add network RTT to every uncached request).
AUTH_URL="${AUTH_URL:-http://127.0.0.1:$AUTH_PORT}"
LYNXX_API_KEY="${LYNXX_API_KEY:-lnx_live_dev}"

# Cap lynxx-gateway logging so we don't fill the disk at sustained 50k+
# RPS. Earlier runs ballooned _lynxx.log to 74 GB and crashed the rig
# mid-sweep — error-level only is enough to surface failures.
LYNXX_RUST_LOG="${LYNXX_RUST_LOG:-error}"

# ─── Docker images (per-proxy) ───────────────────────────────────────────
# Pinned versions so re-runs are reproducible. Update intentionally.
KONG_IMAGE="${KONG_IMAGE:-kong:3.8}"
ENVOY_IMAGE="${ENVOY_IMAGE:-envoyproxy/envoy:v1.32-latest}"
TRAEFIK_IMAGE="${TRAEFIK_IMAGE:-traefik:v3.2}"
NGINX_IMAGE="${NGINX_IMAGE:-nginx:1.27-alpine}"
HAPROXY_IMAGE="${HAPROXY_IMAGE:-haproxy:3.0-alpine}"
CADDY_IMAGE="${CADDY_IMAGE:-caddy:2.8}"
