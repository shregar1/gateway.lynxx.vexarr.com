global
    nbthread     32
    # maxconn=500000 keeps maxsock (= 2*maxconn + 108) under 1,048,576
    # so haproxy boots within the default benchuser nofile limit.
    # If you want maxconn=1M, you also need ulimit -n >= 2,200,000 —
    # proxies/haproxy.sh wraps the launch with that.
    maxconn      500000
    log          stdout local0 emerg
    tune.bufsize 32768
    ulimit-n     1048576

defaults
    mode    http
    timeout connect 5s
    timeout client  60s
    timeout server  60s
    option  http-keep-alive
    option  dontlognull
    no log

frontend fe
    bind *:28080
    default_backend be

backend be
    server u1 127.0.0.1:19090 check inter 30s maxconn 100000
    http-reuse always
