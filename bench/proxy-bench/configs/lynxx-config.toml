# Minimal lynxx config for the proxy-bench sweep.
# Listens on 28080, routes ALL paths to the mock upstream on 19090.
# Postgres-backed (sqlite would bottleneck under high RPS). No plugins.

[gateway]
proxy_port = 28080
admin_port = 28081
database_url = "postgres://lynxx:lynxx@127.0.0.1:5432/lynxx"
seed_from_config = true
health_check_interval_ms = 30000

[[services]]
name = "bench"
url  = "http://127.0.0.1:19090"
retries = 0
connect_timeout_ms = 1000

[[routes]]
service = "bench"
paths   = ["/"]
methods = ["GET", "POST", "PUT", "DELETE", "HEAD"]
strip_path = false
