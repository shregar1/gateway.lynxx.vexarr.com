# All proxies share the same Postgres + upstream and the same proxy port (28080).
# The orchestrator brings up ONE proxy at a time via `docker compose up -d <proxy>`.
# Postgres + upstream stay running always (postgres is only needed for lynxx but
# the 1% CPU cost is negligible and avoids stop/start races).

x-common: &common
  network_mode: host        # eliminate docker bridge NAT overhead
  ulimits:
    nofile: { soft: 1048576, hard: 1048576 }
  restart: "no"

services:
  # Persistent infra — never stopped during the sweep
  postgres:
    <<: *common
    image: postgres:16-alpine
    shm_size: 1gb
    environment:
      POSTGRES_USER: lynxx
      POSTGRES_PASSWORD: lynxx
      POSTGRES_DB: lynxx
    # Tuned for low-latency, non-durable bench workload (NOT production safe).
    command:
      - postgres
      - -c
      - max_connections=2000
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=16GB
      - -c
      - work_mem=16MB
      - -c
      - synchronous_commit=off
      - -c
      - fsync=off
      - -c
      - full_page_writes=off
      - -c
      - wal_level=minimal
      - -c
      - max_wal_senders=0
      - -c
      - log_min_messages=error
      - -c
      - listen_addresses=127.0.0.1

  # Proxies (one up at a time)
  lynxx:
    <<: *common
    image: lynxx-gateway:bench
    environment:
      RUST_LOG: error
      LYNXX_DATABASE_URL: "postgres://lynxx:lynxx@127.0.0.1:5432/lynxx"
    volumes:
      - ./configs/lynxx-config.toml:/etc/lynxx/config.toml:ro

  nginx:
    <<: *common
    image: nginx:1.27-alpine
    volumes:
      - ./configs/nginx.conf:/etc/nginx/nginx.conf:ro

  haproxy:
    <<: *common
    image: haproxy:3.0-alpine
    volumes:
      - ./configs/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro

  envoy:
    <<: *common
    image: envoyproxy/envoy:v1.32-latest
    command: ["-c", "/etc/envoy/envoy.yaml", "--concurrency", "0"]
    volumes:
      - ./configs/envoy.yaml:/etc/envoy/envoy.yaml:ro

  traefik:
    <<: *common
    image: traefik:v3.2
    command:
      - "--providers.file.filename=/etc/traefik/traefik.yml"
      - "--entrypoints.web.address=:28080"
      - "--api=false"
      - "--accesslog=false"
      - "--log.level=ERROR"
    volumes:
      - ./configs/traefik.yml:/etc/traefik/traefik.yml:ro

  kong:
    <<: *common
    image: kong:3.8
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:28080 reuseport backlog=16384"
      KONG_ADMIN_LISTEN: "off"
      KONG_NGINX_WORKER_PROCESSES: "auto"
      KONG_PROXY_ACCESS_LOG: "off"
      KONG_LOG_LEVEL: "error"
    volumes:
      - ./configs/kong.yml:/etc/kong/kong.yml:ro
