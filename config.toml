[gateway]
proxy_port = 28080
admin_port = 28081
database_url = "sqlite://lynxx.db?mode=rwc"
seed_from_config = true
health_check_interval_ms = 10000
health_circuit_failure_threshold = 3
health_circuit_success_threshold = 2
health_circuit_open_duration_ms = 30000

# Time-Travel Debug: where the request-recorder plugin writes captured
# request/response pairs and where the admin API loads them from.
# Defaults to ~/.lynxx/recordings when unset.
# recordings_directory = "/var/lib/lynxx/recordings"

# Subscription api key. Prefer `LYNXX_API_KEY=lnx_live_…` env var over
# pasting the key into TOML. Validated against auth.vexarr.com on
# boot; the response sets tier / expiry / quotas.
# [license]
# api_key = "lnx_live_xxxxxxxxxxxxxxxxxxxxxxxx"

[[services]]
name = "example-service"
url = "http://httpbin.org"
retries = 3
connect_timeout_ms = 5000

[[routes]]
paths = ["/example"]
methods = ["GET", "POST"]
service = "example-service"
strip_path = true

[[plugins]]
name = "rate-limit"
enabled = true

[plugins.config]
requests_per_second = 100

[[plugins]]
name = "cors"
enabled = true

[plugins.config]
allow_origins = ["*"]

[[plugins]]
name = "logging"
enabled = true
