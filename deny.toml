# cargo-deny config. Run locally: `cargo deny check`.
# Schema: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false

[output]
feature-depth = 1

# ── Advisories (delegated to `cargo audit` in CI for richer output) ──
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
# Each entry is an EXPLICIT, time-bound acceptance with rationale — not a
# blanket suppression. Re-review on every dependency bump.
#
# NOTE: the wasmtime 27.x advisories (14 of them, incl. two CRITICAL sandbox
# escapes RUSTSEC-2026-0095/0096) were FIXED by upgrading to wasmtime 36.x —
# they are intentionally NOT ignored here.
ignore = [
  # rsa 0.9 "Marvin Attack" timing side-channel. No fixed upstream version
  # exists yet. Pulled in transitively (sqlx-mysql path); the gateway does not
  # perform attacker-timed RSA private-key operations on a request path.
  # TODO: drop the unused sqlx mysql feature / dep chain to remove `rsa`.
  "RUSTSEC-2023-0071",
  # hickory-proto O(n²) name-compression CPU DoS during message ENCODING.
  # Fix requires hickory-proto >=0.26.1, i.e. a two-major-version bump of
  # hickory-resolver (0.24 -> 0.26) with a breaking resolver-builder API change
  # in proxy/http_client.rs. Tracked as a dedicated follow-up so the resolver
  # migration can be tested on its own rather than riding this security batch.
  "RUSTSEC-2026-0119",
]

# ── Licenses ──
# Permissive OSS licenses that ship with rustc + first-party deps. Add
# new ones here when a new crate trips the check, with a one-line note
# about which crate introduced it.
[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "CC0-1.0",
  "Zlib",
  "MPL-2.0",
  "OpenSSL",
]
confidence-threshold = 0.8
exceptions = []

# ── Bans / version policy ──
# `multiple-versions = "warn"` is intentional: with 78k LoC of Rust the
# transitive dep tree has many duplicates from independently-versioned
# crates. Flip to "deny" once `cargo tree -d` is empty.
[bans]
multiple-versions = "warn"
wildcards = "warn"
allow-wildcard-paths = true
deny = []
skip = []
skip-tree = []

# ── Source provenance ──
[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
